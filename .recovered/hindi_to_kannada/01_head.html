<!DOCTYPE html>
<html lang="hi" data-version="2" data-built="2026-09-22" data-pair="hindi_to_kannada" data-target="kn-IN" data-speak-label="सुनिए">
<head>
<meta charset="UTF-8" />

<title>ಕನ್ನಡ ಕಲಿಯೋಣ - हिन्दी से कन्नड़</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />

<style>
  :root {
    --paper: #F4ECDA;
    --paper-warm: #EFE5CC;
    --paper-deep: #E8DCBE;
    --ink: #1C1611;
    --ink-soft: #3A2F24;
    --ink-faded: #6B5B48;
    --sindoor: #A83024;
    --sindoor-deep: #7B1F17;
    --ochre: #B8802D;
    --ochre-light: #D4A24A;
    --teal: #1F4D4A;
    --leaf: #4A6B2F;
    --rule: rgba(28, 22, 17, 0.15);
    --rule-strong: rgba(28, 22, 17, 0.35);
    --shadow: 0 1px 2px rgba(28, 22, 17, 0.04), 0 4px 16px rgba(28, 22, 17, 0.06);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    font-family: 'Noto Serif Devanagari', 'Noto Serif', Georgia, serif;
    font-size: 18px;
    line-height: 1.75;
    color: var(--ink);
    background: var(--paper);
    background-image:
      radial-gradient(circle at 15% 10%, rgba(184, 128, 45, 0.06), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(168, 48, 36, 0.04), transparent 40%);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  body::before {
    content: "";
    position: fixed; inset: 0;
    pointer-events: none;
    opacity: 0.3;
    z-index: 0;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.11  0 0 0 0 0.09  0 0 0 0 0.07  0 0 0 0.06 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  .kan { font-family: 'Noto Serif Kannada', serif; }
  .hi { font-family: 'Noto Serif Devanagari', serif; }
  .mono { font-family: 'JetBrains Mono', monospace; }

  .wrap { max-width: 780px; margin: 0 auto; padding: 0 22px; position: relative; z-index: 1; }

  /* --- masthead --- */
  header.masthead {
    padding: 48px 0 28px;
    text-align: center;
    border-bottom: 1px solid var(--rule);
    position: relative;
  }
  header.masthead::after {
    content: "";
    display: block;
    width: 60px; height: 2px;
    background: var(--sindoor);
    margin: 18px auto -1px;
  }
  .pretitle {
    font-family: 'Fraunces', serif;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--sindoor);
    margin-bottom: 14px;
  }
  h1.title {
    font-family: 'Noto Serif Devanagari', serif;
    font-weight: 700;
    font-size: clamp(30px, 7vw, 50px);
    line-height: 1.15;
    margin: 0 0 6px;
    color: var(--ink);
  }
  h1.title .kan { font-weight: 500; display: block; font-size: 0.6em; color: var(--ink-soft); margin-bottom: 10px; }
  .subtitle {
    font-family: 'Noto Serif Devanagari', serif;
    font-size: clamp(15px, 3.5vw, 18px);
    color: var(--ink-faded);
    font-weight: 400;
    margin: 14px auto 0;
    max-width: 560px;
    line-height: 1.7;
  }
  .byline { font-size: 13px; color: var(--ink-faded); margin-top: 18px; }
  .byline .sep { color: var(--ochre); margin: 0 8px; }
  .credit {
    margin-top: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--sindoor);
  }

  /* --- stage navigator --- */
  nav.stages {
    position: sticky; top: 0;
    z-index: 10;
    background: rgba(244, 236, 218, 0.92);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--rule);
  }
  .stages-scroll {
    display: flex;
    gap: 0;
    overflow-x: auto;
    scroll-behavior: smooth;
    scrollbar-width: none;
    padding: 0 16px;
    max-width: 780px;
    margin: 0 auto;
  }
  .stages-scroll::-webkit-scrollbar { display: none; }
  .stage-tab {
    flex: 0 0 auto;
    padding: 14px 12px 12px;
    border: 0;
    background: transparent;
    font-family: 'Noto Serif Devanagari', serif;
    font-size: 13px;
    font-weight: 500;
    color: var(--ink-faded);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
    transition: color 0.2s, border-color 0.2s;
    min-height: 44px;
  }
  .stage-tab .num {
    font-family: 'Noto Serif Devanagari', serif;
    font-size: 10px;
    color: var(--sindoor);
    display: block;
    margin-bottom: 2px;
    letter-spacing: 0.1em;
  }
  .stage-tab:hover { color: var(--ink-soft); }
  .stage-tab.active { color: var(--ink); border-bottom-color: var(--sindoor); }

  /* --- stages --- */
  main { padding: 30px 0 80px; }
  section.stage { display: none; animation: fadeIn 0.4s ease; }
  section.stage.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .stage-head { margin-bottom: 26px; }
  .stage-label {
    font-family: 'Noto Serif Devanagari', serif;
    font-size: 12px;
    letter-spacing: 0.18em;
    color: var(--sindoor);
    margin-bottom: 6px;
  }
  h2.stage-title {
    font-family: 'Noto Serif Devanagari', serif;
    font-weight: 700;
    font-size: clamp(26px, 6vw, 38px);
    line-height: 1.2;
    margin: 0 0 8px;
  }
  .stage-lede {
    font-family: 'Noto Serif Devanagari', serif;
    font-weight: 400;
    font-size: clamp(16px, 3.5vw, 19px);
    color: var(--ink-soft);
    line-height: 1.65;
    margin: 10px 0 0;
    padding-left: 14px;
    border-left: 2px solid var(--ochre);
  }

  h3 {
    font-family: 'Noto Serif Devanagari', serif;
    font-weight: 600;
    font-size: 21px;
    margin: 36px 0 12px;
    color: var(--ink);
  }
  h3 .num {
    font-family: 'Noto Serif Devanagari', serif;
    font-size: 14px;
    color: var(--sindoor);
    margin-right: 10px;
    font-weight: 400;
  }

  p { margin: 0 0 14px; }

  /* --- mapping row --- */
  .map-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
    gap: 8px;
    margin: 14px 0 24px;
  }
  .map-cell {
    background: var(--paper-warm);
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: 10px 6px 8px;
    text-align: center;
    cursor: pointer;
    transition: all 0.18s;
    min-height: 100px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    user-select: none;
    position: relative;
  }
  .map-cell:hover, .map-cell:focus-visible {
    background: var(--paper-deep);
    border-color: var(--ochre);
    transform: translateY(-1px);
    box-shadow: var(--shadow);
    outline: none;
  }
  .map-cell .hi-g {
    font-family: 'Noto Serif Devanagari', serif;
    font-size: 24px;
    font-weight: 500;
    color: var(--ink-faded);
    line-height: 1;
  }
  .map-cell .arrow { font-size: 10px; color: var(--ochre); margin: 4px 0; }
  .map-cell .kan-g {
    font-family: 'Noto Serif Kannada', serif;
    font-size: 30px;
    font-weight: 500;
    color: var(--ink);
    line-height: 1;
  }
  .map-cell .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--sindoor);
    margin-top: 4px;
    letter-spacing: 0.04em;
  }
  .map-cell .hint {
    font-family: 'Noto Serif Devanagari', serif;
    font-size: 11px;
    color: var(--ink-faded);
    margin-top: 2px;
    opacity: 0;
    max-height: 0;
    overflow: hidden;
    transition: all 0.25s;
  }
  .map-cell.expanded { border-color: var(--sindoor); background: var(--paper-deep); grid-column: span 2; }
  .map-cell.expanded .hint { opacity: 1; max-height: 70px; margin-top: 4px; }
  .map-cell.new { border-color: var(--sindoor); border-width: 2px; }

  .group-label {
    font-family: 'Noto Serif Devanagari', serif;
    font-size: 13px;
    letter-spacing: 0.08em;
    color: var(--ink-faded);
    margin: 24px 0 8px;
    padding-bottom: 6px;
    border-bottom: 1px dashed var(--rule);
  }

  /* --- word card --- */
  .words { display: grid; gap: 10px; margin: 18px 0 24px; }
  .word {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px 14px;
    padding: 14px 12px;
    background: var(--paper-warm);
    border: 1px solid var(--rule);
    border-radius: 4px;
    border-left: 3px solid var(--ochre);
    align-items: baseline;
  }
  .word .kan { font-family: 'Noto Serif Kannada', serif; font-size: 22px; font-weight: 500; line-height: 1.2; }
  .word .hi-eq { font-family: 'Noto Serif Devanagari', serif; font-size: 18px; color: var(--ink-soft); }
  .word .pron { font-family: 'Noto Serif Devanagari', serif; font-size: 15px; color: var(--sindoor); grid-column: 1 / 3; line-height: 1.5; }
  .word .trans { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--ink-faded); grid-column: 1 / 3; }
  .word .meaning { font-size: 14px; color: var(--ink-faded); grid-column: 1 / 3; }
  .word .note { font-size: 13px; color: var(--teal); grid-column: 1 / 3; }
  .gen {
    display: inline-block; margin-left: 8px; padding: 0 7px;
    font-family: 'Noto Serif Devanagari', serif; font-size: 11px;
    color: var(--paper); background: var(--ink-faded);
    border-radius: 100px; vertical-align: middle; letter-spacing: 0.03em;
  }
  .gen.m { background: var(--sindoor); }
  .gen.f { background: var(--ochre); }
  .gen.n { background: var(--teal); }
  .tag { display:inline-block; padding:0 8px; margin-right:6px; font-family:'Noto Serif Devanagari',serif; font-size:11px;
         border-radius:100px; background:var(--paper-deep); color:var(--ink-faded); border:1px solid var(--rule); }
  .tag.free { color: var(--leaf); border-color: var(--leaf); }
  .tag.core { color: var(--sindoor); border-color: var(--sindoor); }
  .free { display:inline-block; margin-left:8px; padding:0 7px; font-size:11px; border-radius:100px; background:rgba(74,107,47,0.18); color:var(--leaf); }
  .hard { display:inline-block; margin-left:8px; padding:0 7px; font-size:11px; border-radius:100px; background:rgba(168,48,36,0.12); color:var(--sindoor); }

  /* --- sentence --- */
  .sentence {
    margin: 16px 0;
    padding: 16px 18px;
    background: var(--paper-warm);
    border: 1px solid var(--rule);
    border-left: 3px solid var(--teal);
    border-radius: 2px;
  }
  .sentence .kan { font-family: 'Noto Serif Kannada', serif; font-size: 21px; line-height: 1.6; margin-bottom: 6px; font-weight: 500; }
  .sentence .pron { font-family: 'Noto Serif Devanagari', serif; font-size: 15px; color: var(--sindoor); margin-bottom: 4px; line-height: 1.6; }
  .sentence .trans { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--ink-faded); margin-bottom: 4px; }
  .sentence .hi-gloss { font-family: 'Noto Serif Devanagari', serif; font-size: 16px; color: var(--ink-soft); margin-bottom: 4px; }
  .sentence .literal { font-size: 13px; color: var(--ink-faded); font-family: 'Noto Serif Devanagari', serif; border-top: 1px dotted var(--rule); padding-top: 6px; margin-top: 6px; line-height: 1.6; }
  .sentence .literal::before { content: "\261E\00A0"; color: var(--ochre); }

  /* --- conjugation --- */
  .conjug { display: grid; gap: 4px; margin: 14px 0; }
  .conjug-row {
    display: grid;
    grid-template-columns: 1.1fr 1.1fr 1.6fr;
    gap: 8px;
    padding: 8px 0;
    border-bottom: 1px dotted var(--rule);
    font-size: 15px;
    align-items: baseline;
  }
  .conjug-row .pron-kan { font-family: 'Noto Serif Kannada', serif; font-size: 15px; color: var(--ink-faded); }
  .conjug-row .kan { font-family: 'Noto Serif Kannada', serif; font-weight: 500; font-size: 18px; }
  .conjug-row .hi-eq { font-family: 'Noto Serif Devanagari', serif; font-size: 15px; color: var(--ink-soft); }
  .conjug-row .pron-hi { font-family: 'Noto Serif Devanagari', serif; font-size: 13px; color: var(--sindoor); }
  .conjug-head { font-weight: 600; color: var(--sindoor); border-bottom: 1px solid var(--rule-strong); }

  /* --- guni table --- */
  .guni-wrap { overflow-x: auto; margin: 16px -22px 24px; padding: 0 22px; }
  table.guni { border-collapse: collapse; margin: 0 auto; min-width: 100%; }
  table.guni th, table.guni td { border: 1px solid var(--rule); padding: 8px 8px; text-align: center; font-size: 15px; }
  table.guni th { font-family: 'Noto Serif Devanagari', serif; font-size: 12px; font-weight: 500; background: var(--paper-deep); color: var(--sindoor); }
  table.guni .g { font-size: 20px; line-height: 1; }
  table.guni .sub { font-size: 10px; color: var(--ink-faded); display: block; margin-top: 2px; }
  table.guni td.knc { font-family: 'Noto Serif Kannada', serif; }
  table.guni td.hic { font-family: 'Noto Serif Devanagari', serif; }

  /* --- literary block --- */
  .vachana {
    margin: 24px 0;
    padding: 20px 22px;
    background: linear-gradient(180deg, var(--paper-warm), var(--paper-deep));
    border-radius: 4px;
    border: 1px solid var(--rule);
  }
  .vachana::before { content: ""; display: block; width: 28px; height: 2px; background: var(--sindoor); margin-bottom: 14px; }
  .vachana .kan { font-size: 18px; line-height: 1.9; font-weight: 500; margin-bottom: 14px; }
  .vachana .pron { font-family: 'Noto Serif Devanagari', serif; font-size: 15px; color: var(--sindoor); margin-bottom: 10px; line-height: 1.75; }
  .vachana .hi-gloss { font-family: 'Noto Serif Devanagari', serif; font-size: 16px; line-height: 1.7; color: var(--ink-soft); }
  .vachana .attrib { margin-top: 14px; font-family: 'Noto Serif Devanagari', serif; font-size: 12px; color: var(--ink-faded); letter-spacing: 0.06em; }

  /* --- aside --- */
  .aside {
    margin: 18px 0;
    padding: 14px 16px;
    background: rgba(184, 128, 45, 0.08);
    border-left: 2px solid var(--ochre);
    font-size: 15px;
    color: var(--ink-soft);
    border-radius: 0 2px 2px 0;
  }
  .aside strong { color: var(--sindoor); }

  /* --- principles --- */
  .principles { margin: 24px 0; padding: 0; list-style: none; counter-reset: p; }
  .principles li {
    counter-increment: p;
    padding: 16px 0 16px 50px;
    border-top: 1px solid var(--rule);
    position: relative;
  }
  .principles li:last-child { border-bottom: 1px solid var(--rule); }
  .principles li::before {
    content: counter(p, devanagari);
    position: absolute; left: 0; top: 18px;
    font-family: 'Noto Serif Devanagari', serif;
    font-size: 18px; font-weight: 600;
    color: var(--sindoor);
  }

  ul.clean { list-style: none; padding-left: 0; }
  ul.clean li { padding-left: 22px; position: relative; margin-bottom: 8px; }
  ul.clean li::before { content: "\2767"; position: absolute; left: 0; color: var(--ochre); font-size: 14px; top: 2px; }

  /* --- video --- */
  .video { margin: 22px 0; background: var(--ink); border-radius: 4px; overflow: hidden; border: 1px solid var(--rule-strong); }
  .video-frame { position: relative; padding-bottom: 56.25%; height: 0; background: #000; }
  .video-frame iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
  .video-caption { padding: 10px 14px; font-size: 13px; color: var(--paper); background: var(--ink); font-family: 'Noto Serif Devanagari', serif; }
  .video-caption a { color: var(--ochre-light); text-decoration: underline; font-size: 12px; margin-left: 10px; }

  /* --- progress --- */
  .progress {
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    margin: 50px 0 0; padding-top: 22px; border-top: 1px solid var(--rule);
  }
  .progress button {
    padding: 10px 16px;
    font-family: 'Noto Serif Devanagari', serif;
    font-size: 14px; font-weight: 500;
    background: var(--paper-warm); color: var(--ink);
    border: 1px solid var(--rule-strong); border-radius: 3px;
    cursor: pointer; transition: all 0.15s; min-height: 44px;
  }
  .progress button:hover:not(:disabled) { background: var(--sindoor); color: var(--paper); border-color: var(--sindoor); }
  .progress button:disabled { opacity: 0.35; cursor: not-allowed; }
  .progress .dots { display: flex; gap: 5px; }
  .progress .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--rule-strong); transition: all 0.2s; }
  .progress .dot.done { background: var(--leaf); }
  .progress .dot.current { background: var(--sindoor); transform: scale(1.4); }

  footer.colophon {
    margin-top: 60px; padding: 30px 0; border-top: 2px solid var(--ink);
    text-align: center; font-size: 13px; color: var(--ink-faded);
  }
  footer .kan { font-size: 16px; color: var(--sindoor); display: block; margin-bottom: 10px; font-weight: 500; }

  /* --- v2: graded passage --- */
  .passage { margin: 24px 0; padding: 20px 22px; background: linear-gradient(180deg, var(--paper-warm), var(--paper-deep)); border-radius: 4px; border: 1px solid var(--rule); }
  .passage > h3:first-child { margin-top: 0; }
  .passage .sentence { background: rgba(244,236,218,0.7); }
  .passage .kan { font-family: 'Noto Serif Kannada', serif; }

  /* --- v2: morpheme decomposition --- */
  .morph { display: grid; gap: 8px; margin: 16px 0 24px; }
  .morph-row { padding: 12px 14px; background: var(--paper-warm); border: 1px solid var(--rule); border-left: 3px solid var(--teal); border-radius: 4px; }
  .morph-row .m-kan { font-family: 'Noto Serif Kannada', serif; font-size: 21px; font-weight: 500; line-height: 1.4; }
  .morph-row .m-split { font-family: 'Noto Serif Kannada', serif; font-size: 16px; color: var(--ink-soft); margin-top: 4px; line-height: 1.5; }
  .morph-row .m-hi { font-family: 'Noto Serif Devanagari', serif; font-size: 15px; color: var(--ink-soft); margin-top: 4px; }
  .morph-row .m-pron { font-family: 'Noto Serif Devanagari', serif; font-size: 14px; color: var(--sindoor); margin-top: 3px; }
  .morph-row .m-why { font-size: 13px; color: var(--teal); border-top: 1px dotted var(--rule); padding-top: 6px; margin-top: 6px; }

  /* --- v2: false-friend list --- */
  .ff { display: grid; gap: 10px; margin: 16px 0 24px; }
  .ff-row {
    display: grid; grid-template-columns: 1fr 1fr; gap: 4px 14px;
    padding: 12px 14px; background: var(--paper-warm);
    border: 1px solid var(--rule); border-left: 3px solid var(--sindoor); border-radius: 4px;
  }
  .ff-row .t { font-family: 'Noto Serif Kannada', serif; font-size: 21px; font-weight: 500; }
  .ff-row .b { font-family: 'Noto Serif Devanagari', serif; font-size: 19px; font-weight: 500; color: var(--ink-soft); }
  .ff-row .tm, .ff-row .bm { font-size: 14px; color: var(--ink-faded); }
  .ff-row .why { grid-column: 1 / 3; font-size: 13px; color: var(--teal); border-top: 1px dotted var(--rule); padding-top: 6px; margin-top: 4px; }
  @media (max-width: 560px) { .ff-row { grid-template-columns: 1fr; } .ff-row .why { grid-column: 1; } }

  /* --- v2: letter-count working --- */
  .tally { margin: 18px 0; padding: 14px 16px; background: var(--paper-deep); border: 1px solid var(--rule); border-radius: 4px; font-size: 15px; }
  .tally-row { display: flex; justify-content: space-between; gap: 10px; padding: 5px 0; border-bottom: 1px dotted var(--rule); }
